<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">
  <title>Login — MSA HRIS</title>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="logo-mark">MSA</div>
    <h1>MULTISARANA AVINDO</h1>
    <p class="muted">Human Resources Information System</p>

    <form id="loginForm">
      <label>Username</label>
      <input id="username" autocomplete="username" required>

      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password" required>

      <button class="btn primary full" type="submit">MASUK KE SISTEM</button>
      <div id="loginMessage" class="message"></div>
    </form>

    <div class="status"><span id="networkDot">●</span> <span id="networkText">Memeriksa koneksi...</span></div>
    <footer>Created by UQ</footer>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const msg = document.getElementById('loginMessage');
      msg.textContent = 'Memproses...';
      try {
        const result = await apiPost('login', {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        });
        if (!result.success) throw new Error(result.message || 'Login gagal');
        saveSession(result);
        location.href = 'dashboard.html';
      } catch(err) {
        msg.textContent = humanError(err.message);
      }
    });

    function updateNetwork(){
      const online = navigator.onLine;
      document.getElementById('networkDot').textContent = online ? '●' : '●';
      document.getElementById('networkText').textContent = online ? 'Online' : 'Offline';
    }
    addEventListener('online', updateNetwork);
    addEventListener('offline', updateNetwork);
    updateNetwork();
  </script>
</body>
</html>
