<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="MULTISARANA AVINDO HRIS">
  <link rel="icon" href="data:,">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">
  <title>MSA HRIS</title>
</head>
<body>
  <div id="app">
    <div class="splash">
      <div class="logo-mark">MSA</div>
      <h1>MULTISARANA AVINDO</h1>
      <p>Human Resources Information System</p>
      <div class="loader"></div>
      <small id="splashStatus">Memeriksa sesi...</small>
      <small>Created by UQ</small>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    }

    (function routeEntry() {
      const statusEl = document.getElementById('splashStatus');
      try {
        const session = typeof getSession === 'function' ? getSession() : null;
        const target = session && session.token ? 'dashboard.html' : 'login.html';
        if (statusEl) {
          statusEl.textContent = session && session.token
            ? 'Mengalihkan ke Dashboard...'
            : 'Mengalihkan ke halaman Login...';
        }
        location.replace(target);
      } catch (err) {
        console.error(err);
        if (statusEl) {
          statusEl.textContent = 'Mengalihkan ke halaman Login...';
        }
        location.replace('login.html');
      }
    })();
  </script>
</body>
</html>
